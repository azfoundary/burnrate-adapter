name: adapter release

# Builds the BurnRate Adapter for the three platforms the setup page offers.
#
# The download buttons at /settings/adapter point at
# releases/latest/download/<file>, so the asset NAMES here are load-bearing:
# rename one and the button 404s for every user with no error anywhere.
# adaptersetup.go in the BurnRate repo holds the other half of that contract.
#
# The adapter carries no secrets — the server address and token live in the
# burnrate-adapter.json each user downloads from their own instance — so the
# binaries are safe to publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          # CGO off: the adapter talks HTTP and reads a JSON file, so a static
          # binary runs on any machine of its platform with nothing installed.
          # That is the difference between "download and run" and "first
          # install a runtime".
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build \
              -ldflags="-s -w $4" -o "dist/$3" ./cmd/burnrate-adapter
          }
          build darwin  arm64 burnrate-adapter-darwin-arm64 ""
          build darwin  amd64 burnrate-adapter-darwin-amd64 ""
          # -H windowsgui: the Windows build lives in the notification area, so
          # it must not open a console window of its own. It attaches to the
          # calling terminal on demand instead (see console_windows.go), which
          # is what keeps --probe and --console usable.
          build windows amd64 burnrate-adapter-windows-amd64.exe "-H windowsgui"
          build linux   amd64 burnrate-adapter-linux-amd64 ""
          ls -la dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            The BurnRate Adapter writes confirmed expenses into your MoneyLover
            wallet from your own computer, because MoneyLover refuses writes
            that come from a server.

            Download the file for your platform, then get your
            `burnrate-adapter.json` from **Settings ▸ Adapter** in your own
            BurnRate, put both in one folder, and run the adapter.

            Your computer will warn about an unsigned download the first time:
            on macOS right-click ▸ Open, on Windows More info ▸ Run anyway.
